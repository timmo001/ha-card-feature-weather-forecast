# Pinned tools for this repository: pnpm and Node for the build and checks, and
# the linters and hk that the pre-push hook runs.
min_version = "2025.1.0"

[tools]
node = "26.13.1"
pnpm = "12.22.0"
# The linters the shared hk pre-push hook runs, matching CI.
uv = "0.13.9"
# yamllint's PyYAML has no wheels for newer Pythons, and mise won't build it from source.
python = "3.15.2"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Runs the pre-push hook, and the pkl config it reads.
hk = "2.13.0"
pkl = "0.33.0"
